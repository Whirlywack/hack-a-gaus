<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Field</title>
<style>
  html, body { margin:0; background:var(--ground); }
  body { padding:16px; }
  .v { height:auto; }
  .ds-sheet { width:390px; max-width:100%; border:1px solid var(--line); background:var(--ground); }
  .ds-pad { padding:16px 20px; }
  .ds-col { display:grid; gap:14px; }
  .ds-row { display:flex; align-items:center; gap:12px; }
  .ds-wrap { flex-wrap:wrap; }
  .v-tab::before, .v-rtab, .v-screen { transition:none; animation:none; }
</style>
</head>
<body>
<div class="v" lang="lt"><div class="ds-sheet"><div class="ds-pad ds-col"><label class="p-field"><span class="v-label">Jūsų darbai</span><span class="p-field__box"><input class="p-field__input" type="text" placeholder="pvz., gatvių remontas, šaligatviai" autoComplete="off" spellcheck="false" value="kelių ir gatvių remontas"/></span></label><label class="p-field"><span class="v-label">Įmonės kodas</span><span class="p-field__box"><input class="p-field__input" type="text" placeholder="9 skaitmenys" autoComplete="off" spellcheck="false"/></span></label></div></div></div>
</body>
</html>
