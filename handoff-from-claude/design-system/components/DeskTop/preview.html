<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>DeskTop</title>
<style>
  html, body { margin:0; background:var(--ground); }
  body { padding:16px; }
  .v { height:auto; }
  .ds-sheet { width:100%; max-width:100%; border:1px solid var(--line); background:var(--ground); }
  .ds-pad { padding:16px 20px; }
  .ds-col { display:grid; gap:14px; }
  .ds-row { display:flex; align-items:center; gap:12px; }
  .ds-wrap { flex-wrap:wrap; }
  .v-tab::before, .v-rtab, .v-screen { transition:none; animation:none; }
</style>
</head>
<body>
<div class="v" lang="lt"><div class="ds-sheet"><div class="v-desk" style="min-height:0"><header class="v-dtop v-nodes"><button type="button" class="v-dtop__mark"><span class="v-wordmark">gaus</span></button><nav class="v-dnav"><button type="button" class="v-dnav__item">Šiandien</button><button type="button" class="v-dnav__item">Stebimi</button><button type="button" class="v-dnav__item" data-on="true">Rinka</button><button type="button" class="v-dnav__item">Paieška</button></nav><div class="v-dtop__right"><button type="button" aria-label="Paskyra" class="v-acct-hit"><span class="v-acct">KG</span></button></div></header></div></div></div>
</body>
</html>
