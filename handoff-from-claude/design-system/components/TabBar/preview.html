<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>TabBar</title>
<style>
  html, body { margin:0; background:var(--ground); }
  body { padding:16px; }
  .v { height:auto; }
  .ds-sheet { width:390px; max-width:100%; border:1px solid var(--line); background:var(--ground); }
  .ds-pad { padding:16px 20px; }
  .ds-col { display:grid; gap:14px; }
  .ds-row { display:flex; align-items:center; gap:12px; }
  .ds-wrap { flex-wrap:wrap; }
  .v-tab::before, .v-rtab, .v-screen { transition:none; animation:none; }
</style>
</head>
<body>
<div class="v" lang="lt"><div class="ds-sheet"><div class="v-inframe" style="position:relative;height:56px"><nav class="v-tabs"><button type="button" class="v-tab" data-on="true">Šiandien</button><button type="button" class="v-tab">Stebimi</button><button type="button" class="v-tab">Rinka</button><button type="button" class="v-tab">Paieška</button></nav></div></div></div>
</body>
</html>
