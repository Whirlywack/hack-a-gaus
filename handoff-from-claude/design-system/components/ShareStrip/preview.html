<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>ShareStrip</title>
<style>
  html, body { margin:0; background:var(--ground); }
  body { padding:16px; }
  .v { height:auto; }
  .ds-sheet { width:390px; max-width:100%; border:1px solid var(--line); background:var(--ground); }
  .ds-pad { padding:16px 20px; }
  .ds-col { display:grid; gap:14px; }
  .ds-row { display:flex; align-items:center; gap:12px; }
  .ds-wrap { flex-wrap:wrap; }
  .v-tab::before, .v-rtab, .v-screen { transition:none; animation:none; }
</style>
</head>
<body>
<div class="v" lang="lt"><div class="ds-sheet"><div class="ds-pad"><div class="p-share"><div class="p-share__bar"><span class="p-share__seg" data-i="0" style="flex-grow:286"></span><span class="p-share__seg" data-i="1" style="flex-grow:1032"></span><span class="p-share__seg" data-i="2" style="flex-grow:150"></span></div><div class="p-share__legend"><div class="p-share__item"><span class="p-share__key" data-i="0"></span><span class="p-share__pct">19 %</span><span class="v-small">penki didžiausi</span></div><div class="p-share__item"><span class="p-share__key" data-i="1"></span><span class="p-share__pct">70 %</span><span class="v-small">kiti 175</span></div><div class="p-share__item"><span class="p-share__key" data-i="2"></span><span class="p-share__pct">10 %</span><span class="v-small">nepaskelbta</span></div></div></div></div></div></div>
</body>
</html>
