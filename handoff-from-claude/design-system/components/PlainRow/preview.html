<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>PlainRow</title>
<style>
  html, body { margin:0; background:var(--ground); }
  body { padding:16px; }
  .v { height:auto; }
  .ds-sheet { width:390px; max-width:100%; border:1px solid var(--line); background:var(--ground); }
  .ds-pad { padding:16px 20px; }
  .ds-col { display:grid; gap:14px; }
  .ds-row { display:flex; align-items:center; gap:12px; }
  .ds-wrap { flex-wrap:wrap; }
  .v-tab::before, .v-rtab, .v-screen { transition:none; animation:none; }
</style>
</head>
<body>
<div class="v" lang="lt"><div class="ds-sheet"><div class="p-list"><div role="button" tabindex="0" data-tap="" class="v-row p-plain"><div class="v-small">Sutartis pasirašyta rugpjūčio 26 d.</div><div class="v-rowtitle clamp2">Pilies Sodo 1-oji g., Jurbarkas, Jurbarko r. sav. paprastojo remonto darbai</div><div class="p-split"><span class="p-split__a is-quiet">Laimėjo <b class="v-strong">UAB „Jurmelsta“</b></span><span class="p-split__b">112 264 €</span></div></div></div></div></div>
</body>
</html>
