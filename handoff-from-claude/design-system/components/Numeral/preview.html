<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Numeral</title>
<style>
  html, body { margin:0; background:var(--ground); }
  body { padding:16px; }
  .v { height:auto; }
  .ds-sheet { width:390px; max-width:100%; border:1px solid var(--line); background:var(--ground); }
  .ds-pad { padding:16px 20px; }
  .ds-col { display:grid; gap:14px; }
  .ds-row { display:flex; align-items:center; gap:12px; }
  .ds-wrap { flex-wrap:wrap; }
  .v-tab::before, .v-rtab, .v-screen { transition:none; animation:none; }
</style>
</head>
<body>
<div class="v" lang="lt"><div class="ds-sheet"><div class="v-cells"><div class="v-cell"><span class="v-num v-urgent">7<span class="v-unit">d.</span></span></div><div class="v-cell"><span class="v-num">13<span class="v-unit">d.</span></span></div><div class="v-cell"><span class="v-num">3,8<span class="v-unit">mln. €</span></span></div></div></div></div>
</body>
</html>
