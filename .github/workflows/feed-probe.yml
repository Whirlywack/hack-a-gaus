name: Feed probe (temporary)

# TEMPORARY (ticket #6 review): walks the open-notice feed and prints field names,
# distinct values and counts only, plus per procedure whether the public notice page
# opens without sign-in. No record contents are printed and nothing is written.
# Removed after use.
on:
  push:
    branches: [ticket-6]
    paths:
      - scripts/feed-probe.mjs
      - .github/workflows/feed-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe
        env:
          VPT_API_KEY: ${{ secrets.VPT_API_KEY }}
        run: node scripts/feed-probe.mjs
