name: Feed probe (temporary)

# TEMPORARY (ticket #6): prints field names, distinct values and counts of the
# kind and status fields from a sample of the open-notice feed. No record
# contents are printed and no database is touched. Removed after use.
on:
  push:
    branches: [ticket-6]
    paths:
      - scripts/feed-probe.mjs
      - .github/workflows/feed-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe
        env:
          VPT_API_KEY: ${{ secrets.VPT_API_KEY }}
        run: node scripts/feed-probe.mjs
