name: Feed probe (temporary)

# TEMPORARY (ticket #6 security review): counts of contact details in the feed's text
# fields. No record contents are printed and nothing is written. Removed after use.
on:
  push:
    branches: [ticket-6]
    paths:
      - scripts/feed-probe.mjs
      - .github/workflows/feed-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Probe
        env:
          VPT_API_KEY: ${{ secrets.VPT_API_KEY }}
        run: node scripts/feed-probe.mjs
