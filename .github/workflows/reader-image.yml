name: Reader image

# Builds the image the reader runs on (LibreOffice, pdftotext, python-docx, openpyxl).
on:
  push:
    branches: [main]
    paths: [reader/Dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: reader
          file: reader/Dockerfile
          push: true
          tags: ghcr.io/whirlywack/gaus-reader:latest
